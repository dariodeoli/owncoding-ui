name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: El paquete se arma y exporta
        run: |
          npm pack --dry-run >/dev/null
          node -e "import('./dist/index.js').then(m => { if (typeof m.Button !== 'function' || typeof m.Switch !== 'function' || m.Toggle !== undefined) process.exit(1) })"

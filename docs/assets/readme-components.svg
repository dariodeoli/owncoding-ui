<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="626" viewBox="0 0 1200 626" role="img" aria-labelledby="title desc">
  <title id="title">Muestra de componentes de OwnCoding UI</title>
  <desc id="desc">Panel ilustrativo basado en los tokens reales con primitivas, campos, datos, estados y navegación.</desc>
